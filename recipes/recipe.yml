---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: Aluminium OS (latest)
description: Lightweight atomic linux distro

base-image: ghcr.io/ublue-os/silverblue-nvidia
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - @xfce-desktop-environment
        - xfce4-goodies
        - lightdm
        - lightdm-gtk-greeter
        - python3
        - python3-pip
        - fuse-libs
        - xarchiver
        - thunar-archive-plugin
        
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - libreoffice-core
        - libreoffice-calc
        - libreoffice-impress
        - libreoffice-writer
        - gnome-shell
        - gnome-initial-setup
        - nautilus            
        - yelp                
        - gnome-tour          
        - gnome-user-docs     
        - gnome-calculator    
        - gnome-calendar      
        - gnome-clocks        
        - gnome-maps          
        - gnome-weather       
        - gnome-contacts      
        - gnome-characters    
        - gnome-font-viewer   
        - gnome-logs          
        - gnome-system-monitor 
        - gnome-text-editor   
        - loupe              
        - snapshot            
        - evince              
        - baobab              
        - totem              
        - simple-scan         
        - cheese
        - gdm

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.onlyoffice.desktopeditors
          - dev.vencord.Vesktop
          - it.mijorus.gearlever
      - scope: user

  - type: signing

  - type: script
    snippets:
      - "systemctl enable lightdm.service"
